name: test
on:
  push:
    branches: [master]
  pull_request:

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  lints:
    name: Format + Lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart format --output none --set-exit-if-changed .
      - run: dart analyze --fatal-warnings .
  linux-native:
    name: Linux native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter test
      - run: xvfb-run flutter test integration_test/webcrypto_test.dart -d linux
        working-directory: ./example
      - run: dart test -p vm
  linux-browser:
    name: Linux browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter test --platform chrome
      - run: flutter test --platform chrome --wasm
      - uses: nanasess/setup-chromedriver@v2
      - name: Run integration_test with chromedriver
        working-directory: ./example
        run: |
          xvfb-run ../tool/with-chromedriver.sh flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/webcrypto_test.dart \
            -d chrome
      - run: xvfb-run dart test -p firefox
  macos-native:
    name: MacOS native
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter test
      - run: flutter test integration_test/webcrypto_test.dart -d macos
        working-directory: ./example
      - run: dart test -p vm
  macos-browser:
    name: MacOS browser
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter test --platform chrome
      - run: flutter test --platform chrome --wasm
      # TODO: Enable chromedriver testing on MacOS when it works reliably
      - uses: browser-actions/setup-firefox@v1
      - name: dart test -p firefox
        shell: bash
        # Remove FIREFOX_EXECUTABLE override when flutter upgrades past package:test 1.25.8
        # Issue is fixed in https://github.com/dart-lang/test/pull/2276
        run: |
          export FIREFOX_EXECUTABLE="$(which firefox)"
          dart test -p firefox
  windows-native:
    name: Windows native
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: ilammy/setup-nasm@v1
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: flutter test
      - run: flutter test integration_test/webcrypto_test.dart -d windows
        working-directory: ./example
      - run: dart test -p vm
  windows-browser:
    name: Windows browser
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: ilammy/setup-nasm@v1
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      #- run: flutter test --platform chrome
      #- run: flutter test --platform chrome --wasm
      - uses: nanasess/setup-chromedriver@v2
      - name: Run integration_test with chromedriver
        working-directory: ./example
        shell: bash
        run: |
          ../tool/with-chromedriver.sh flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/webcrypto_test.dart \
            -d chrome
      - run: dart test -p firefox
  ios:
    name: iOS emulator (iPhone)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - uses: futureware-tech/simulator-action@v3
        with:
          model: 'iPhone 16e'
      - run: flutter pub get
      - run: flutter test integration_test/webcrypto_test.dart -d iphone
        working-directory: ./example
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run flutter test integration_test/webcrypto_test.dart -d emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          # TODO: switch back to default once this is issue resolved:
          # https://issuetracker.google.com/issues/432143095
          target: google_apis
          arch: x86_64
          working-directory: ./example
          script: flutter test integration_test/webcrypto_test.dart -d emulator
  linux-native-coverage:
    name: Linux native coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
          flutter config --no-analytics
      - run: flutter pub get
      - run: dart test -p vm --coverage ./coverage
      # Report collected coverage
      - name: Convert coverage to lcov
        run: dart run coverage:format_coverage -i ./coverage -o ./coverage/lcov.info --lcov --report-on lib/
      - uses: coverallsapp/github-action@v2
        with:
          flag-name: linux-native
          parallel: true
  linux-browser-coverage:
    name: Linux browser coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: xvfb-run dart test -p chrome,firefox -c dart2js,dart2wasm --coverage ./coverage
      # Report collected coverage
      - name: Convert coverage to lcov
        run: dart run coverage:format_coverage -i ./coverage -o ./coverage/lcov.info --lcov --report-on lib/
      - uses: coverallsapp/github-action@v2
        with:
          flag-name: linux-browser
          parallel: true
  windows-native-coverage:
    name: Windows native coverage
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: ilammy/setup-nasm@v1
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: dart test -p vm --coverage ./coverage
      # Report collected coverage
      - name: Convert coverage to lcov
        run: dart run coverage:format_coverage -i ./coverage -o ./coverage/lcov.info --lcov --report-on lib/
      - uses: coverallsapp/github-action@v2
        with:
          flag-name: windows-native
          parallel: true
  windows-browser-coverage:
    name: Windows browser coverage
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: ilammy/setup-nasm@v1
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
      - run: flutter pub get
      - run: dart test -p chrome,firefox --coverage ./coverage
      # Report collected coverage
      - name: Convert coverage to lcov
        run: dart run coverage:format_coverage -i ./coverage -o ./coverage/lcov.info --lcov --report-on lib/
      - uses: coverallsapp/github-action@v2
        with:
          flag-name: windows-browser
          parallel: true
  coverage:
    name: Report to coveralls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - linux-native-coverage
      - linux-browser-coverage
      - windows-native-coverage
      - windows-browser-coverage
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
