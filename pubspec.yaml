name: webcrypto
version: 0.6.0
description: Cross-platform implementation of Web Cryptography APIs for Flutter.
repository: https://github.com/google/webcrypto.dart

environment:
  sdk: ^3.10.0
  flutter: ^3.38.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.10.0
  boringssl_dart:
    git:
      url: https://github.com/koji-1009/boringssl_dart.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0

  flutter_lints: ^6.0.0  
  coverage: any # we only need format_coverage, don't care what version

topics:
 - crypto
